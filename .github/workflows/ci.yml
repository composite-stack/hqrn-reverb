          echo "=== Configuring Sanitizer Build ==="
          cmake -B build_sanitizer -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON -G Ninja 2>&1 | tee sanitizer_diagnostics/build_configure_sanitizer.log

          echo "=== Compiling Sanitizer Targets ==="
          cmake --build build_sanitizer 2>&1 | tee sanitizer_diagnostics/build_compile_sanitizer.log

          echo "=== Executing SIMD NEON Dispatch Test with ASan & UBSan ==="
          ./build_sanitizer/test_cpu_dispatch 2>&1 | tee sanitizer_diagnostics/asan_ubsan_simd_dispatch.log

          echo "=== Executing Skalar Fallback Test with ASan & UBSan ==="
          ./build_sanitizer/test_cpu_dispatch_scalar 2>&1 | tee sanitizer_diagnostics/asan_ubsan_scalar_dispatch.log

          echo "=== CTest Sanitizer Verification ==="
