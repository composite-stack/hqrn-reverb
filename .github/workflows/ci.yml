name: HQRN Audio DSP CI & Release (x86_64 AVX2, ARM64 NEON & Multi-Platform Packages)

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish official GitHub Release'
        required: false
        type: boolean
        default: false
      custom_version:
        description: 'Custom version override (e.g. 0.1.0)'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  # ===========================================================================
  # 0. Version & Release Metadata Resolution
  # ===========================================================================
  resolve-version:
    name: Resolve Version & Release Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      is_tag: ${{ steps.version.outputs.is_tag }}
      is_release: ${{ steps.version.outputs.is_release }}
      short_sha: ${{ steps.version.outputs.short_sha }}
      build_timestamp: ${{ steps.version.outputs.build_timestamp }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compute Semantic Version
        id: version
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TIMESTAMP=$(date -u +"%Y%m%dT%H%M%SZ")
          IS_TAG=false
          IS_RELEASE=false
          PRERELEASE=false

          if [[ "${{ github.ref }}" =~ ^refs/tags/v[0-9] ]]; then
            IS_TAG=true
            IS_RELEASE=true
            TAG_NAME="${{ github.ref_name }}"
            VERSION="${TAG_NAME#v}"
            if [[ "${TAG_NAME}" == *"-"* ]]; then
              PRERELEASE=true
            fi
          elif [ "${{ github.event.inputs.custom_version }}" != "" ]; then
            RAW_VERSION="${{ github.event.inputs.custom_version }}"
            VERSION="${RAW_VERSION#v}"
            TAG_NAME="v${VERSION}"
            if [ "${{ github.event.inputs.publish_release }}" = "true" ]; then
              IS_RELEASE=true
            fi
            if [[ "${VERSION}" == *"-"* ]]; then
              PRERELEASE=true
            fi
          else
            VERSION="0.1.0-dev+${TIMESTAMP}.sha.${SHORT_SHA}"
            TAG_NAME="v0.1.0-dev"
            PRERELEASE=true
            if [ "${{ github.event.inputs.publish_release }}" = "true" ]; then
              IS_RELEASE=true
            fi
          fi

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version '${VERSION}'. Expected semantic version X.Y.Z with optional prerelease/build metadata." >&2
            exit 1
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "is_tag=${IS_TAG}" >> $GITHUB_OUTPUT
          echo "is_release=${IS_RELEASE}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "build_timestamp=${TIMESTAMP}" >> $GITHUB_OUTPUT
          echo "prerelease=${PRERELEASE}" >> $GITHUB_OUTPUT

          echo "### Version & Release Metadata" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Wert |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | \`${VERSION}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tag Name** | \`${TAG_NAME}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Is Git Tag** | \`${IS_TAG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Publish Release** | \`${IS_RELEASE}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Prerelease** | \`${PRERELEASE}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit SHA** | \`${SHORT_SHA}\` |" >> $GITHUB_STEP_SUMMARY
  # ===========================================================================
  # 1. Native x86_64 Runner: AVX2 + FMA & Graceful Fallback
  # ===========================================================================
  x86_64-avx2-fma:
    name: x86_64 (${{ matrix.compiler }}) - Native AVX2 & Sanitizers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++-13, g++-14, clang++-17, clang++-18]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize Diagnostic Metadata
        id: meta
        env:
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          JOB_NAME: ${{ github.job }}
          COMPILER_ID: ${{ matrix.compiler }}
          WORKFLOW_NAME: ${{ github.workflow }}
          GIT_REF: ${{ github.ref }}
          GIT_REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
        run: |
          mkdir -p sanitizer_diagnostics
          TIMESTAMP_ISO=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          TIMESTAMP_TAG=$(date -u +"%Y%m%dT%H%M%SZ")
          SHORT_SHA=$(echo "${COMMIT_SHA}" | cut -c1-7)
          EPOCH=$(date +%s)
          REF_SLUG=$(echo "${GIT_REF_NAME}" | tr '/' '-' | tr -cd '[:alnum:]-_.' | cut -c1-24)
          EVENT_SLUG=$(echo "${EVENT_NAME}" | tr -cd '[:alnum:]-_' | cut -c1-15)
          IS_RERUN=$([ "${RUN_ATTEMPT}" -gt 1 ] && echo "true" || echo "false")
          ARTIFACT_NAME="asan-ubsan-failure-${JOB_NAME}-${COMPILER_ID}-run${RUN_ID}-att${RUN_ATTEMPT}-${EVENT_SLUG}-${REF_SLUG}-sha${SHORT_SHA}-${TIMESTAMP_TAG}"

          echo "timestamp_iso=${TIMESTAMP_ISO}" >> $GITHUB_OUTPUT
          echo "timestamp_tag=${TIMESTAMP_TAG}" >> $GITHUB_OUTPUT
          echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "run_id=${RUN_ID}" >> $GITHUB_OUTPUT
          echo "run_number=${RUN_NUMBER}" >> $GITHUB_OUTPUT
          echo "run_attempt=${RUN_ATTEMPT}" >> $GITHUB_OUTPUT
          echo "job_name=${JOB_NAME}" >> $GITHUB_OUTPUT
          echo "event_name=${EVENT_NAME}" >> $GITHUB_OUTPUT
          echo "git_ref=${GIT_REF}" >> $GITHUB_OUTPUT
          echo "git_ref_name=${GIT_REF_NAME}" >> $GITHUB_OUTPUT
          echo "artifact_name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT

          # 1. Human-readable diagnostic metadata
          {
            echo "================================================================================"
            echo "HQRN CI SANITIZER FAILURE DIAGNOSTIC METADATA"
            echo "================================================================================"
            echo "Commit SHA:             ${COMMIT_SHA}"
            echo "Short SHA:              ${SHORT_SHA}"
            echo "Workflow Run ID:        ${RUN_ID}"
            echo "Workflow Run Number:    ${RUN_NUMBER}"
            echo "Workflow Run Attempt:   ${RUN_ATTEMPT} (Wiederholung: ${IS_RERUN})"
            echo "Trigger Event:          ${EVENT_NAME}"
            echo "Git Ref:                ${GIT_REF}"
            echo "Git Ref Name:           ${GIT_REF_NAME}"
            echo "Job Name:               ${JOB_NAME}"
            echo "Target Matrix Compiler: ${COMPILER_ID}"
            echo "Workflow Name:          ${WORKFLOW_NAME}"
            echo "Triggered By (Actor):   ${ACTOR}"
            echo "Timestamp (UTC):        ${TIMESTAMP_ISO}"
            echo "Timestamp (Epoch):      ${EPOCH}"
            echo "Diagnostic Package:     ${ARTIFACT_NAME}"
            echo "================================================================================"
          } > sanitizer_diagnostics/diagnostic_metadata.txt

          # 2. Machine-readable JSON metadata
          cat <<EOF > sanitizer_diagnostics/metadata.json
          {
            "commit_sha": "${COMMIT_SHA}",
            "short_sha": "${SHORT_SHA}",
            "workflow_run_id": "${RUN_ID}",
            "workflow_run_number": "${RUN_NUMBER}",
            "workflow_run_attempt": ${RUN_ATTEMPT},
            "is_rerun": ${IS_RERUN},
            "trigger_event": "${EVENT_NAME}",
            "git_ref": "${GIT_REF}",
            "git_ref_name": "${GIT_REF_NAME}",
            "job_name": "${JOB_NAME}",
            "matrix_compiler": "${COMPILER_ID}",
            "workflow": "${WORKFLOW_NAME}",
            "actor": "${ACTOR}",
            "timestamp_utc": "${TIMESTAMP_ISO}",
            "timestamp_epoch": ${EPOCH},
            "artifact_name": "${ARTIFACT_NAME}"
          }
          EOF

          # 3. Formatted Step Summary markdown template
          cat <<EOF > sanitizer_diagnostics/step_summary.md
          ### ⚠️ Sanitizer-Lauf Fehlgeschlagen: Diagnose-Übersicht
          | Parameter | Wert |
          |---|---|
          | **Commit-SHA** | \`${COMMIT_SHA}\` (\`${SHORT_SHA}\`) |
          | **Workflow Run ID** | [${RUN_ID}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${RUN_ID}) (Run #${RUN_NUMBER}) |
          | **Run Attempt (Wiederholung)** | **Versuch #${RUN_ATTEMPT}** |
          | **Trigger-Event** | \`${EVENT_NAME}\` |
          | **Git-Ref** | \`${GIT_REF}\` (\`${GIT_REF_NAME}\`) |
          | **Jobname** | \`${JOB_NAME}\` |
          | **Compiler / Ziel** | \`${COMPILER_ID}\` (x86_64 AVX2/FMA) |
          | **Zeitpunkt (UTC)** | `${TIMESTAMP_ISO}` |
          | **Artefakt-Paket** | \`${ARTIFACT_NAME}\` |

          Die vollständigen Diagnose-Logs (Kompilierung, SIMD-, Skalar- und CTest-Logs samt CPU- und Compiler-Metadaten) wurden als Artefakt hochgeladen.
          EOF

      - name: Validate Diagnostic Metadata Consistency
        env:
          DIAGNOSTICS_DIR: sanitizer_diagnostics
          EXP_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXP_TRIGGER_EVENT: ${{ github.event_name }}
          EXP_GIT_REF: ${{ github.ref }}
          EXP_GIT_REF_NAME: ${{ github.ref_name }}
        run: |
          python3 scripts/verify_diagnostic_metadata.py

      - name: Verify Native CPU Features (AVX2 & FMA)
        run: |
          echo "=== CPU Hardware Info ==="
          lscpu | grep -E "Model name|Flags" || cat /proc/cpuinfo | grep -E "model name|flags" | head -n 2
          echo "=== Checking AVX2 and FMA Support ==="
          if grep -q "avx2" /proc/cpuinfo && grep -q "fma" /proc/cpuinfo; then
            echo "SUCCESS: Host CPU supports native AVX2 and FMA."
          else
            echo "ERROR: Runner CPU lacks AVX2 or FMA flags!"
            exit 1
          fi

      - name: Install Compiler & Build Tools
        run: |
          sudo apt-get update -qq
          PKG=$(echo "${{ matrix.compiler }}" | sed 's/++//')
          sudo apt-get install -y -qq "$PKG" "${{ matrix.compiler }}" cmake ninja-build 2>/dev/null || sudo apt-get install -y -qq "$PKG" cmake ninja-build || sudo apt-get install -y -qq cmake ninja-build || true

      - name: Build & Run Native Release Targets (SIMD AVX2 & Skalar)
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          mkdir -p build_release
          cmake -B build_release -DCMAKE_BUILD_TYPE=Release -G Ninja
          cmake --build build_release
          ctest --test-dir build_release --output-on-failure

      - name: Record Diagnostic Environment & Compiler Metadata
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          {
            echo "=== RUNNER SYSTEM & ARCHITECTURE ==="
            uname -a
            echo "Architecture: $(uname -m)"
            cat /etc/os-release 2>/dev/null || true
            echo "=== CPU HARDWARE SPECIFICATION ==="
            lscpu 2>/dev/null || cat /proc/cpuinfo
          } > sanitizer_diagnostics/runner_arch_info.txt

          {
            echo "=== COMPILER METADATA ==="
            which "${CXX}" || true
            "${CXX}" --version
          } > sanitizer_diagnostics/compiler_version.txt

      - name: Build & Run ASan + UBSan Sanitizer Targets (SIMD AVX2 & Skalar)
        env:
          CXX: ${{ matrix.compiler }}
          ASAN_OPTIONS: "halt_on_error=1:abort_on_error=1:detect_leaks=1"
          UBSAN_OPTIONS: "halt_on_error=1:abort_on_error=1:print_stacktrace=1"
        shell: bash
        run: |
          set -e
          set -o pipefail

          echo "=== Configuring Sanitizer Build ==="
          cmake -B build_sanitizer -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON -G Ninja 2>&1 | tee sanitizer_diagnostics/build_configure_sanitizer.log

          echo "=== Compiling Sanitizer Targets ==="
          cmake --build build_sanitizer 2>&1 | tee sanitizer_diagnostics/build_compile_sanitizer.log

          echo "=== Executing SIMD AVX2 Dispatch Test with ASan & UBSan ==="
          ./build_sanitizer/test_cpu_dispatch 2>&1 | tee sanitizer_diagnostics/asan_ubsan_simd_dispatch.log

          echo "=== Executing Skalar Fallback Test with ASan & UBSan ==="
          ./build_sanitizer/test_cpu_dispatch_scalar 2>&1 | tee sanitizer_diagnostics/asan_ubsan_scalar_dispatch.log

          echo "=== Executing DAW Adapter Test with ASan & UBSan ==="
          ./build_sanitizer/test_daw_adapter 2>&1 | tee sanitizer_diagnostics/asan_ubsan_daw_adapter.log

          echo "=== Executing DAW Adapter Skalar Test with ASan & UBSan ==="
          ./build_sanitizer/test_daw_adapter_scalar 2>&1 | tee sanitizer_diagnostics/asan_ubsan_daw_adapter_scalar.log

          echo "=== Executing Standalone Renderer with ASan & UBSan ==="
          ./build_sanitizer/hqrn_render --mode impulse --len 0.1 --output sanitizer_render_smoke.wav 2>&1 | tee sanitizer_diagnostics/asan_ubsan_render.log

          echo "=== CTest Sanitizer Verification ==="
          ctest --test-dir build_sanitizer --output-on-failure 2>&1 | tee sanitizer_diagnostics/ctest_sanitizer.log

      - name: Summarize Sanitizer Failure in Workflow Run
        if: failure()
        run: |
          if [ -n "$GITHUB_STEP_SUMMARY" ] && [ -f "sanitizer_diagnostics/step_summary.md" ]; then
            cat sanitizer_diagnostics/step_summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Sanitizer Failure Diagnostic Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name || format('asan-ubsan-failure-{0}-{1}-run{2}-att{3}-{4}', github.job, matrix.compiler, github.run_id, github.run_attempt, github.sha) }}
          path: sanitizer_diagnostics/
          retention-days: 14
          if-no-files-found: warn

  # ===========================================================================
  # 2. Native Linux ARM64 Runner: Ubuntu 24.04 ARM (Native NEON)
  # ===========================================================================
  arm64-neon-linux:
    name: Linux ARM64 (${{ matrix.compiler }}) - Native NEON & Sanitizers
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++-13, clang++-18]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize Diagnostic Metadata
        id: meta
        env:
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          JOB_NAME: ${{ github.job }}
          COMPILER_ID: ${{ matrix.compiler }}
          WORKFLOW_NAME: ${{ github.workflow }}
          GIT_REF: ${{ github.ref }}
          GIT_REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
        run: |
          mkdir -p sanitizer_diagnostics
          TIMESTAMP_ISO=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          TIMESTAMP_TAG=$(date -u +"%Y%m%dT%H%M%SZ")
          SHORT_SHA=$(echo "${COMMIT_SHA}" | cut -c1-7)
          EPOCH=$(date +%s)
          REF_SLUG=$(echo "${GIT_REF_NAME}" | tr '/' '-' | tr -cd '[:alnum:]-_.' | cut -c1-24)
          EVENT_SLUG=$(echo "${EVENT_NAME}" | tr -cd '[:alnum:]-_' | cut -c1-15)
          IS_RERUN=$([ "${RUN_ATTEMPT}" -gt 1 ] && echo "true" || echo "false")
          ARTIFACT_NAME="asan-ubsan-failure-${JOB_NAME}-${COMPILER_ID}-run${RUN_ID}-att${RUN_ATTEMPT}-${EVENT_SLUG}-${REF_SLUG}-sha${SHORT_SHA}-${TIMESTAMP_TAG}"

          echo "timestamp_iso=${TIMESTAMP_ISO}" >> $GITHUB_OUTPUT
          echo "timestamp_tag=${TIMESTAMP_TAG}" >> $GITHUB_OUTPUT
          echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "run_id=${RUN_ID}" >> $GITHUB_OUTPUT
          echo "run_number=${RUN_NUMBER}" >> $GITHUB_OUTPUT
          echo "run_attempt=${RUN_ATTEMPT}" >> $GITHUB_OUTPUT
          echo "job_name=${JOB_NAME}" >> $GITHUB_OUTPUT
          echo "event_name=${EVENT_NAME}" >> $GITHUB_OUTPUT
          echo "git_ref=${GIT_REF}" >> $GITHUB_OUTPUT
          echo "git_ref_name=${GIT_REF_NAME}" >> $GITHUB_OUTPUT
          echo "artifact_name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT

          # 1. Human-readable diagnostic metadata
          {
            echo "================================================================================"
            echo "HQRN CI SANITIZER FAILURE DIAGNOSTIC METADATA"
            echo "================================================================================"
            echo "Commit SHA:             ${COMMIT_SHA}"
            echo "Short SHA:              ${SHORT_SHA}"
            echo "Workflow Run ID:        ${RUN_ID}"
            echo "Workflow Run Number:    ${RUN_NUMBER}"
            echo "Workflow Run Attempt:   ${RUN_ATTEMPT} (Wiederholung: ${IS_RERUN})"
            echo "Trigger Event:          ${EVENT_NAME}"
            echo "Git Ref:                ${GIT_REF}"
            echo "Git Ref Name:           ${GIT_REF_NAME}"
            echo "Job Name:               ${JOB_NAME}"
            echo "Target Matrix Compiler: ${COMPILER_ID}"
            echo "Workflow Name:          ${WORKFLOW_NAME}"
            echo "Triggered By (Actor):   ${ACTOR}"
            echo "Timestamp (UTC):        ${TIMESTAMP_ISO}"
            echo "Timestamp (Epoch):      ${EPOCH}"
            echo "Diagnostic Package:     ${ARTIFACT_NAME}"
            echo "================================================================================"
          } > sanitizer_diagnostics/diagnostic_metadata.txt

          # 2. Machine-readable JSON metadata
          cat <<EOF > sanitizer_diagnostics/metadata.json
          {
            "commit_sha": "${COMMIT_SHA}",
            "short_sha": "${SHORT_SHA}",
            "workflow_run_id": "${RUN_ID}",
            "workflow_run_number": "${RUN_NUMBER}",
            "workflow_run_attempt": ${RUN_ATTEMPT},
            "is_rerun": ${IS_RERUN},
            "trigger_event": "${EVENT_NAME}",
            "git_ref": "${GIT_REF}",
            "git_ref_name": "${GIT_REF_NAME}",
            "job_name": "${JOB_NAME}",
            "matrix_compiler": "${COMPILER_ID}",
            "workflow": "${WORKFLOW_NAME}",
            "actor": "${ACTOR}",
            "timestamp_utc": "${TIMESTAMP_ISO}",
            "timestamp_epoch": ${EPOCH},
            "artifact_name": "${ARTIFACT_NAME}"
          }
          EOF

          # 3. Formatted Step Summary markdown template
          cat <<EOF > sanitizer_diagnostics/step_summary.md
          ### ⚠️ Sanitizer-Lauf Fehlgeschlagen: Diagnose-Übersicht
          | Parameter | Wert |
          |---|---|
          | **Commit-SHA** | \`${COMMIT_SHA}\` (\`${SHORT_SHA}\`) |
          | **Workflow Run ID** | [${RUN_ID}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${RUN_ID}) (Run #${RUN_NUMBER}) |
          | **Run Attempt (Wiederholung)** | **Versuch #${RUN_ATTEMPT}** |
          | **Trigger-Event** | \`${EVENT_NAME}\` |
          | **Git-Ref** | \`${GIT_REF}\` (\`${GIT_REF_NAME}\`) |
          | **Jobname** | \`${JOB_NAME}\` |
          | **Compiler / Ziel** | \`${COMPILER_ID}\` (Linux ARM64 NEON) |
          | **Zeitpunkt (UTC)** | `${TIMESTAMP_ISO}` |
          | **Artefakt-Paket** | \`${ARTIFACT_NAME}\` |

          Die vollständigen Diagnose-Logs (Kompilierung, SIMD-, Skalar- und CTest-Logs samt CPU- und Compiler-Metadaten) wurden als Artefakt hochgeladen.
          EOF

      - name: Validate Diagnostic Metadata Consistency
        env:
          DIAGNOSTICS_DIR: sanitizer_diagnostics
          EXP_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXP_TRIGGER_EVENT: ${{ github.event_name }}
          EXP_GIT_REF: ${{ github.ref }}
          EXP_GIT_REF_NAME: ${{ github.ref_name }}
        run: |
          python3 scripts/verify_diagnostic_metadata.py

      - name: Verify Native ARM64 & NEON Architecture
        run: |
          echo "=== Architecture ==="
          uname -m
          if [ "$(uname -m)" != "aarch64" ]; then
            echo "ERROR: Expected aarch64 runner but got $(uname -m)"
            exit 1
          fi
          echo "=== CPU Features ==="
          lscpu | grep -E "Architecture|Model name|Flags" || cat /proc/cpuinfo | head -n 15
          if grep -E -q "asimd|neon" /proc/cpuinfo; then
            echo "SUCCESS: Native ARM NEON (ASIMD) detected."
          else
            echo "ERROR: ASIMD/NEON not reported in /proc/cpuinfo"
            exit 1
          fi

      - name: Install Compiler & Build Tools
        run: |
          sudo apt-get update -qq
          PKG=$(echo "${{ matrix.compiler }}" | sed 's/++//')
          sudo apt-get install -y -qq "$PKG" "${{ matrix.compiler }}" cmake ninja-build 2>/dev/null || sudo apt-get install -y -qq "$PKG" cmake ninja-build || sudo apt-get install -y -qq cmake ninja-build || true

      - name: Build & Run Native Release Targets (SIMD NEON & Skalar)
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          mkdir -p build_release
          cmake -B build_release -DCMAKE_BUILD_TYPE=Release -G Ninja
          cmake --build build_release
          ctest --test-dir build_release --output-on-failure

      - name: Record Diagnostic Environment & Compiler Metadata
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          {
            echo "=== RUNNER SYSTEM & ARCHITECTURE ==="
            uname -a
            echo "Architecture: $(uname -m)"
            cat /etc/os-release 2>/dev/null || true
            echo "=== CPU HARDWARE SPECIFICATION ==="
            lscpu 2>/dev/null || cat /proc/cpuinfo
          } > sanitizer_diagnostics/runner_arch_info.txt

          {
            echo "=== COMPILER METADATA ==="
            which "${CXX}" || true
            "${CXX}" --version
          } > sanitizer_diagnostics/compiler_version.txt

      - name: Build & Run ASan + UBSan Sanitizer Targets (SIMD NEON & Skalar)
        env:
          CXX: ${{ matrix.compiler }}
          ASAN_OPTIONS: "halt_on_error=1:abort_on_error=1:detect_leaks=1"
          UBSAN_OPTIONS: "halt_on_error=1:abort_on_error=1:print_stacktrace=1"
        shell: bash
        run: |
          set -e
          set -o pipefail

          echo "=== Configuring Sanitizer Build ==="
          cmake -B build_sanitizer -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON -G Ninja 2>&1 | tee sanitizer_diagnostics/build_configure_sanitizer.log

          echo "=== Compiling Sanitizer Targets ==="
          cmake --build build_sanitizer 2>&1 | tee sanitizer_diagnostics/build_compile_sanitizer.log

          echo "=== Executing SIMD NEON Dispatch Test with ASan & UBSan ==="
          ./build_sanitizer/test_cpu_dispatch 2>&1 | tee sanitizer_diagnostics/asan_ubsan_simd_dispatch.log

          echo "=== Executing Skalar Fallback Test with ASan & UBSan ==="
          ./build_sanitizer/test_cpu_dispatch_scalar 2>&1 | tee sanitizer_diagnostics/asan_ubsan_scalar_dispatch.log

          echo "=== Executing DAW Adapter Test with ASan & UBSan ==="
          ./build_sanitizer/test_daw_adapter 2>&1 | tee sanitizer_diagnostics/asan_ubsan_daw_adapter.log

          echo "=== Executing DAW Adapter Skalar Test with ASan & UBSan ==="
          ./build_sanitizer/test_daw_adapter_scalar 2>&1 | tee sanitizer_diagnostics/asan_ubsan_daw_adapter_scalar.log

          echo "=== Executing Standalone Renderer with ASan & UBSan ==="
          ./build_sanitizer/hqrn_render --mode impulse --len 0.1 --output sanitizer_render_smoke.wav 2>&1 | tee sanitizer_diagnostics/asan_ubsan_render.log

          echo "=== CTest Sanitizer Verification ==="
          ctest --test-dir build_sanitizer --output-on-failure 2>&1 | tee sanitizer_diagnostics/ctest_sanitizer.log

      - name: Summarize Sanitizer Failure in Workflow Run
        if: failure()
        run: |
          if [ -n "$GITHUB_STEP_SUMMARY" ] && [ -f "sanitizer_diagnostics/step_summary.md" ]; then
            cat sanitizer_diagnostics/step_summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Sanitizer Failure Diagnostic Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name || format('asan-ubsan-failure-{0}-{1}-run{2}-att{3}-{4}', github.job, matrix.compiler, github.run_id, github.run_attempt, github.sha) }}
          path: sanitizer_diagnostics/
          retention-days: 14
          if-no-files-found: warn

  # ===========================================================================
  # 3. Native macOS Apple Silicon Runner: macOS 15 / ARM64 (Native NEON)
  # ===========================================================================
  arm64-neon-macos:
    name: macOS ARM64 (Apple Clang) - Native Apple Silicon & Sanitizers
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize Diagnostic Metadata
        id: meta
        env:
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          JOB_NAME: ${{ github.job }}
          COMPILER_ID: apple-clang
          WORKFLOW_NAME: ${{ github.workflow }}
          GIT_REF: ${{ github.ref }}
          GIT_REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
        run: |
          mkdir -p sanitizer_diagnostics
          TIMESTAMP_ISO=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          TIMESTAMP_TAG=$(date -u +"%Y%m%dT%H%M%SZ")
          SHORT_SHA=$(echo "${COMMIT_SHA}" | cut -c1-7)
          EPOCH=$(date +%s)
          REF_SLUG=$(echo "${GIT_REF_NAME}" | tr '/' '-' | tr -cd '[:alnum:]-_.' | cut -c1-24)
          EVENT_SLUG=$(echo "${EVENT_NAME}" | tr -cd '[:alnum:]-_' | cut -c1-15)
          IS_RERUN=$([ "${RUN_ATTEMPT}" -gt 1 ] && echo "true" || echo "false")
          ARTIFACT_NAME="asan-ubsan-failure-${JOB_NAME}-${COMPILER_ID}-run${RUN_ID}-att${RUN_ATTEMPT}-${EVENT_SLUG}-${REF_SLUG}-sha${SHORT_SHA}-${TIMESTAMP_TAG}"

          echo "timestamp_iso=${TIMESTAMP_ISO}" >> $GITHUB_OUTPUT
          echo "timestamp_tag=${TIMESTAMP_TAG}" >> $GITHUB_OUTPUT
          echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "run_id=${RUN_ID}" >> $GITHUB_OUTPUT
          echo "run_number=${RUN_NUMBER}" >> $GITHUB_OUTPUT
          echo "run_attempt=${RUN_ATTEMPT}" >> $GITHUB_OUTPUT
          echo "job_name=${JOB_NAME}" >> $GITHUB_OUTPUT
          echo "event_name=${EVENT_NAME}" >> $GITHUB_OUTPUT
          echo "git_ref=${GIT_REF}" >> $GITHUB_OUTPUT
          echo "git_ref_name=${GIT_REF_NAME}" >> $GITHUB_OUTPUT
          echo "artifact_name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT

          # 1. Human-readable diagnostic metadata
          {
            echo "================================================================================"
            echo "HQRN CI SANITIZER FAILURE DIAGNOSTIC METADATA"
            echo "================================================================================"
            echo "Commit SHA:             ${COMMIT_SHA}"
            echo "Short SHA:              ${SHORT_SHA}"
            echo "Workflow Run ID:        ${RUN_ID}"
            echo "Workflow Run Number:    ${RUN_NUMBER}"
            echo "Workflow Run Attempt:   ${RUN_ATTEMPT} (Wiederholung: ${IS_RERUN})"
            echo "Trigger Event:          ${EVENT_NAME}"
            echo "Git Ref:                ${GIT_REF}"
            echo "Git Ref Name:           ${GIT_REF_NAME}"
            echo "Job Name:               ${JOB_NAME}"
            echo "Target Compiler:        ${COMPILER_ID}"
            echo "Workflow Name:          ${WORKFLOW_NAME}"
            echo "Triggered By (Actor):   ${ACTOR}"
            echo "Timestamp (UTC):        ${TIMESTAMP_ISO}"
            echo "Timestamp (Epoch):      ${EPOCH}"
            echo "Diagnostic Package:     ${ARTIFACT_NAME}"
            echo "================================================================================"
          } > sanitizer_diagnostics/diagnostic_metadata.txt

          # 2. Machine-readable JSON metadata
          cat <<EOF > sanitizer_diagnostics/metadata.json
          {
            "commit_sha": "${COMMIT_SHA}",
            "short_sha": "${SHORT_SHA}",
            "workflow_run_id": "${RUN_ID}",
            "workflow_run_number": "${RUN_NUMBER}",
            "workflow_run_attempt": ${RUN_ATTEMPT},
            "is_rerun": ${IS_RERUN},
            "trigger_event": "${EVENT_NAME}",
            "git_ref": "${GIT_REF}",
            "git_ref_name": "${GIT_REF_NAME}",
            "job_name": "${JOB_NAME}",
            "compiler": "${COMPILER_ID}",
            "workflow": "${WORKFLOW_NAME}",
            "actor": "${ACTOR}",
            "timestamp_utc": "${TIMESTAMP_ISO}",
            "timestamp_epoch": ${EPOCH},
            "artifact_name": "${ARTIFACT_NAME}"
          }
          EOF

          # 3. Formatted Step Summary markdown template
          cat <<EOF > sanitizer_diagnostics/step_summary.md
          ### ⚠️ Sanitizer-Lauf Fehlgeschlagen: Diagnose-Übersicht
          | Parameter | Wert |
          |---|---|
          | **Commit-SHA** | \`${COMMIT_SHA}\` (\`${SHORT_SHA}\`) |
          | **Workflow Run ID** | [${RUN_ID}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${RUN_ID}) (Run #${RUN_NUMBER}) |
          | **Run Attempt (Wiederholung)** | **Versuch #${RUN_ATTEMPT}** |
          | **Trigger-Event** | \`${EVENT_NAME}\` |
          | **Git-Ref** | \`${GIT_REF}\` (\`${GIT_REF_NAME}\`) |
          | **Jobname** | \`${JOB_NAME}\` |
          | **Compiler / Ziel** | \`Apple Clang\` (macOS ARM64 Apple Silicon) |
          | **Zeitpunkt (UTC)** | `${TIMESTAMP_ISO}` |
          | **Artefakt-Paket** | \`${ARTIFACT_NAME}\` |

          Die vollständigen Diagnose-Logs (Kompilierung, SIMD-, Skalar- und CTest-Logs samt CPU- und Compiler-Metadaten) wurden als Artefakt hochgeladen.
          EOF

      - name: Validate Diagnostic Metadata Consistency
        env:
          DIAGNOSTICS_DIR: sanitizer_diagnostics
          EXP_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXP_TRIGGER_EVENT: ${{ github.event_name }}
          EXP_GIT_REF: ${{ github.ref }}
          EXP_GIT_REF_NAME: ${{ github.ref_name }}
        run: |
          python3 scripts/verify_diagnostic_metadata.py

      - name: Verify Apple Silicon Architecture
        run: |
          echo "=== Machine Architecture ==="
          uname -m
          sysctl -n machdep.cpu.brand_string
          if [ "$(uname -m)" != "arm64" ]; then
            echo "ERROR: Expected arm64 runner but got $(uname -m)"
            exit 1
          fi

      - name: Build & Run Native Release Targets (Apple Clang NEON & Skalar)
        run: |
          mkdir -p build_release
          cmake -B build_release -DCMAKE_BUILD_TYPE=Release
          cmake --build build_release
          ctest --test-dir build_release --output-on-failure

      - name: Offline Audio Renderer Smoke Test (Apple Silicon Native WAV Generation)
        run: |
          echo "=== 1. Testing Standalone Renderer via CMake Target ==="
          ./build_release/hqrn_render --mode impulse --t60 1.2 --fbase 120 --len 2.0 --output macos_smoke_impulse.wav --metrics-json macos_smoke_metrics.json
          ./build_release/hqrn_render --mode orbit --t60 1.2 --len 0.2 --output macos_smoke_orbit.wav

          echo "=== 2. Testing Standalone Renderer via Makefile Target ==="
          make render
          ./hqrn_render --mode burst --len 0.1 --output macos_smoke_burst.wav

          echo "=== 3. Verifying Generated WAV Files (Headers & Payload) ==="
          ls -la macos_smoke_*.wav
          python3 -c "
          import wave
          files = ['macos_smoke_impulse.wav', 'macos_smoke_orbit.wav', 'macos_smoke_burst.wav']
          for f in files:
              with wave.open(f, 'rb') as w:
                  print(f'Verified {f}: {w.getnchannels()}ch, {w.getsampwidth()}bytes/sample, {w.getframerate()}Hz, {w.getnframes()} frames')
                  assert w.getnchannels() == 2, f'Expected stereo (2 channels) in {f}'
                  assert w.getframerate() == 48000, f'Expected 48 kHz in {f}'
                  assert w.getnframes() > 0, f'Expected non-empty audio in {f}'
          print('All macOS WAV smoke test outputs validated successfully.')
          "

          echo "=== 4. Acoustic Plausibility Verification (EDT, T20, T30 on Apple Silicon) ==="
          python3 scripts/verify_acoustic_metrics.py \
            --metrics-json macos_smoke_metrics.json \
            --wav macos_smoke_impulse.wav \
            --target-t60 1.2 \
            --tolerance 0.15 \
            --stereo-tolerance 0.15 \
            --decay-tolerance 0.20

          echo "=== 5. Negative Test & Error Diagnostic Output for Invalid Acoustic Results ==="
          # Generate an intentionally truncated impulse response (T60=2.5s, length only 0.2s)
          # to exercise the failure path and verify rich diagnostic reporting.
          ./build_release/hqrn_render --mode impulse --t60 2.5 --fbase 120 --len 0.2 \
            --output macos_smoke_invalid_trunc.wav --metrics-json macos_smoke_invalid_trunc.json

          echo "Executing verifier against invalid/truncated decay data (expecting failure exit code 1)..."
          set +e
          INVALID_OUT=$(python3 scripts/verify_acoustic_metrics.py \
            --metrics-json macos_smoke_invalid_trunc.json \
            --wav macos_smoke_invalid_trunc.wav \
            --target-t60 2.5 2>&1)
          VERIFY_RC=$?
          set -e

          echo "--- DIAGNOSTIC ERROR OUTPUT ON INVALID RESULTS ---"
          echo "$INVALID_OUT"
          echo "--- END DIAGNOSTIC ERROR OUTPUT ---"

          if [ $VERIFY_RC -eq 0 ]; then
            echo "ERROR: Verifier unexpectedly accepted truncated acoustic decay data!"
            exit 1
          fi

          if ! echo "$INVALID_OUT" | grep -q "FEHLER: AKUSTISCHE METRIK-PLAUSIBILITÄTSPRÜFUNG FEHLGESCHLAGEN"; then
            echo "ERROR: Expected diagnostic error headline not found in verifier output!"
            exit 1
          fi

          echo "SUCCESS: Verifier correctly rejected invalid acoustic data and produced full diagnostic output."

          echo "=== 6. Running Acoustic Plausibility Unit & Regression Test Suite ==="
          python3 scripts/test_verify_acoustic_metrics.py

          echo "=== 7. Running Renderer Metrics Integration Test Suite ==="
          HQRN_RENDER_BIN=./build_release/hqrn_render python3 scripts/test_render_metrics_integration.py

      - name: Record Diagnostic Environment & Compiler Metadata
        run: |
          {
            echo "=== RUNNER SYSTEM & ARCHITECTURE ==="
            uname -a
            echo "Architecture: $(uname -m)"
            sw_vers 2>/dev/null || true
            echo "=== CPU HARDWARE SPECIFICATION ==="
            sysctl -n machdep.cpu.brand_string 2>/dev/null || true
            sysctl -a | grep machdep.cpu 2>/dev/null || true
          } > sanitizer_diagnostics/runner_arch_info.txt

          {
            echo "=== COMPILER METADATA ==="
            which clang++ || true
            clang++ --version
          } > sanitizer_diagnostics/compiler_version.txt

      - name: Build & Run ASan + UBSan Sanitizer Targets (Apple Clang NEON & Skalar)
        env:
          ASAN_OPTIONS: "halt_on_error=1:abort_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1:abort_on_error=1:print_stacktrace=1"
        shell: bash
        run: |
          set -e
          set -o pipefail

          echo "=== Configuring Sanitizer Build ==="
          cmake -B build_sanitizer -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON 2>&1 | tee sanitizer_diagnostics/build_configure_sanitizer.log

          echo "=== Compiling Sanitizer Targets ==="
          cmake --build build_sanitizer 2>&1 | tee sanitizer_diagnostics/build_compile_sanitizer.log

          echo "=== Executing SIMD NEON Dispatch Test with ASan & UBSan ==="
          ./build_sanitizer/test_cpu_dispatch 2>&1 | tee sanitizer_diagnostics/asan_ubsan_simd_dispatch.log

          echo "=== Executing Skalar Fallback Test with ASan & UBSan ==="
          ./build_sanitizer/test_cpu_dispatch_scalar 2>&1 | tee sanitizer_diagnostics/asan_ubsan_scalar_dispatch.log

          echo "=== Executing DAW Adapter Test with ASan & UBSan ==="
          ./build_sanitizer/test_daw_adapter 2>&1 | tee sanitizer_diagnostics/asan_ubsan_daw_adapter.log

          echo "=== Executing DAW Adapter Skalar Test with ASan & UBSan ==="
          ./build_sanitizer/test_daw_adapter_scalar 2>&1 | tee sanitizer_diagnostics/asan_ubsan_daw_adapter_scalar.log

          echo "=== Executing Standalone Renderer with ASan & UBSan ==="
          ./build_sanitizer/hqrn_render --mode impulse --len 0.1 --output sanitizer_render_smoke.wav 2>&1 | tee sanitizer_diagnostics/asan_ubsan_render.log

          echo "=== CTest Sanitizer Verification ==="
          ctest --test-dir build_sanitizer --output-on-failure 2>&1 | tee sanitizer_diagnostics/ctest_sanitizer.log

      - name: Summarize Sanitizer Failure in Workflow Run
        if: failure()
        run: |
          if [ -n "$GITHUB_STEP_SUMMARY" ] && [ -f "sanitizer_diagnostics/step_summary.md" ]; then
            cat sanitizer_diagnostics/step_summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Sanitizer Failure Diagnostic Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name || format('asan-ubsan-failure-{0}-apple-clang-run{1}-att{2}-{3}', github.job, github.run_id, github.run_attempt, github.sha) }}
          path: sanitizer_diagnostics/
          retention-days: 14
          if-no-files-found: warn

  # ===========================================================================
  # 4. Isolated Diagnostic Metadata Verifier & Negative Injection Test
  # ===========================================================================
  test-diagnostic-verifier-negative:
    name: Isolated Negative Test - Metadata Consistency Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify Documentation Anchors and Link Integrity
        run: |
          echo "=== Verifying Documentation Anchors & Strict Duplicate Validation ==="
          python3 scripts/verify_markdown_anchors.py DIAGNOSTIC_METADATA_TESTING.md --required beispielpfad-1 beispielpfad-2 beispielpfad-3 beispielpfad-4 beispielpfad-5 --strict-duplicates
          echo "=== Executing Markdown Anchor Regression & Invariant Test Suite ==="
          python3 scripts/test_verify_markdown_anchors.py
          echo "=== Executing Property-Based & Fuzzing Test Suite ==="
          python3 scripts/fuzz_percent_encoding.py --iterations 2000 --verbose

      - name: Run Full Isolated Negative Inconsistency Test Suite
        run: |
          echo "=== Executing 15 Automated Negative Inconsistency Test Scenarios ==="
          python3 scripts/test_verify_diagnostic_metadata.py

      - name: Run Acoustic Metrics Plausibility Unit & Invariant Test Suite
        run: |
          echo "=== Executing Acoustic Metrics Plausibility Test Suite (EDT, T20, T30) ==="
          python3 scripts/test_verify_acoustic_metrics.py

      - name: Run Renderer Metrics & Acoustic Verifier End-to-End Integration Test Suite
        run: |
          echo "=== Building Renderer and Executing End-to-End Integration Tests ==="
          make render
          python3 scripts/test_render_metrics_integration.py

      - name: Live Negative Test - Inject Corrupted Run Attempt
        env:
          DIAGNOSTICS_DIR: test_bad_attempt_diag
          EXP_RUN_ATTEMPT: "1"
          EXP_TRIGGER_EVENT: "push"
          EXP_GIT_REF: "refs/heads/main"
        run: |
          mkdir -p test_bad_attempt_diag
          echo '{"workflow_run_attempt": 99, "trigger_event": "push", "git_ref": "refs/heads/main"}' > test_bad_attempt_diag/metadata.json
          cat << 'ENDTXT' > test_bad_attempt_diag/diagnostic_metadata.txt
          Workflow Run Attempt:   99
          Trigger Event:          push
          Git Ref:                refs/heads/main
          ENDTXT
          cat << 'ENDMD' > test_bad_attempt_diag/step_summary.md
          | Parameter | Wert |
          |---|---|
          | **Run Attempt (Wiederholung)** | **Versuch #99** |
          | **Trigger-Event** | `push` |
          | **Git-Ref** | `refs/heads/main` |
          ENDMD

          echo "Running verifier against injected attempt mismatch (expected 1, got 99)..."
          set +e
          OUTPUT=$(python3 scripts/verify_diagnostic_metadata.py 2>&1)
          EXIT_CODE=$?
          set -e

          echo "Verifier output:"
          echo "$OUTPUT"

          if [ $EXIT_CODE -eq 0 ]; then
            echo "ERROR: Verifier unexpectedly passed with inconsistent run attempt!"
            exit 1
          fi

          if ! echo "$OUTPUT" | grep -q "workflow_run_attempt mismatch"; then
            echo "ERROR: Expected error message 'workflow_run_attempt mismatch' not found in verifier output!"
            exit 1
          fi

          echo "SUCCESS: Verifier correctly rejected corrupted run attempt with expected diagnostic error message."

      - name: Live Negative Test - Inject Corrupted Trigger Event
        env:
          DIAGNOSTICS_DIR: test_bad_event_diag
          EXP_RUN_ATTEMPT: "1"
          EXP_TRIGGER_EVENT: "push"
          EXP_GIT_REF: "refs/heads/main"
        run: |
          mkdir -p test_bad_event_diag
          echo '{"workflow_run_attempt": 1, "trigger_event": "pull_request", "git_ref": "refs/heads/main"}' > test_bad_event_diag/metadata.json
          cat << 'ENDTXT' > test_bad_event_diag/diagnostic_metadata.txt
          Workflow Run Attempt:   1
          Trigger Event:          pull_request
          Git Ref:                refs/heads/main
          ENDTXT
          cat << 'ENDMD' > test_bad_event_diag/step_summary.md
          | Parameter | Wert |
          |---|---|
          | **Run Attempt (Wiederholung)** | **Versuch #1** |
          | **Trigger-Event** | `pull_request` |
          | **Git-Ref** | `refs/heads/main` |
          ENDMD

          echo "Running verifier against injected event mismatch (expected push, got pull_request)..."
          set +e
          OUTPUT=$(python3 scripts/verify_diagnostic_metadata.py 2>&1)
          EXIT_CODE=$?
          set -e

          echo "Verifier output:"
          echo "$OUTPUT"

          if [ $EXIT_CODE -eq 0 ]; then
            echo "ERROR: Verifier unexpectedly passed with inconsistent trigger event!"
            exit 1
          fi

          if ! echo "$OUTPUT" | grep -q "trigger_event mismatch"; then
            echo "ERROR: Expected error message 'trigger_event mismatch' not found in verifier output!"
            exit 1
          fi

          echo "SUCCESS: Verifier correctly rejected corrupted trigger event with expected diagnostic error message."

      - name: Live Negative Test - Inject Corrupted Git Ref
        env:
          DIAGNOSTICS_DIR: test_bad_ref_diag
          EXP_RUN_ATTEMPT: "1"
          EXP_TRIGGER_EVENT: "push"
          EXP_GIT_REF: "refs/heads/main"
        run: |
          mkdir -p test_bad_ref_diag
          echo '{"workflow_run_attempt": 1, "trigger_event": "push", "git_ref": "refs/heads/fake_branch"}' > test_bad_ref_diag/metadata.json
          cat << 'ENDTXT' > test_bad_ref_diag/diagnostic_metadata.txt
          Workflow Run Attempt:   1
          Trigger Event:          push
          Git Ref:                refs/heads/fake_branch
          ENDTXT
          cat << 'ENDMD' > test_bad_ref_diag/step_summary.md
          | Parameter | Wert |
          |---|---|
          | **Run Attempt (Wiederholung)** | **Versuch #1** |
          | **Trigger-Event** | `push` |
          | **Git-Ref** | `refs/heads/fake_branch` |
          ENDMD

          echo "Running verifier against injected git_ref mismatch (expected refs/heads/main, got refs/heads/fake_branch)..."
          set +e
          OUTPUT=$(python3 scripts/verify_diagnostic_metadata.py 2>&1)
          EXIT_CODE=$?
          set -e

          echo "Verifier output:"
          echo "$OUTPUT"

          if [ $EXIT_CODE -eq 0 ]; then
            echo "ERROR: Verifier unexpectedly passed with inconsistent git ref!"
            exit 1
          fi

          if ! echo "$OUTPUT" | grep -q "git_ref mismatch"; then
            echo "ERROR: Expected error message 'git_ref mismatch' not found in verifier output!"
            exit 1
          fi

          echo "SUCCESS: Verifier correctly rejected corrupted git ref with expected diagnostic error message."

  # ===========================================================================
  # 5. Release Build: Platform-Independent C++20 Header Package
  # ===========================================================================
  build-release-headers:
    name: Package Platform-Independent Headers
    needs: [resolve-version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Assemble Header Package & CMake Config
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          PKG_NAME="hqrn-${VERSION}-headers"
          mkdir -p "pkg/${PKG_NAME}/include/hqrn"
          mkdir -p "pkg/${PKG_NAME}/share/doc/hqrn"
          mkdir -p "pkg/${PKG_NAME}/lib/cmake/HQRN"

          cp HQRNReverbEngine.hpp "pkg/${PKG_NAME}/include/hqrn/"
          cp HQRNKernels.hpp "pkg/${PKG_NAME}/include/hqrn/"
          cp HQRNDawAdapter.hpp "pkg/${PKG_NAME}/include/hqrn/"
          cp README.md "pkg/${PKG_NAME}/share/doc/hqrn/"
          cp DIAGNOSTIC_METADATA_TESTING.md "pkg/${PKG_NAME}/share/doc/hqrn/"

          # Generate CMake Package Config
          cat << EOF > "pkg/${PKG_NAME}/lib/cmake/HQRN/HQRNConfigVersion.cmake"
          set(PACKAGE_VERSION "${VERSION}")
          if(PACKAGE_VERSION VERSION_LESS PACKAGE_FIND_VERSION)
            set(PACKAGE_VERSION_COMPATIBLE FALSE)
          else()
            set(PACKAGE_VERSION_COMPATIBLE TRUE)
            if(PACKAGE_FIND_VERSION_MAJOR EQUAL 0)
              if(NOT PACKAGE_FIND_VERSION_MINOR EQUAL 1)
                set(PACKAGE_VERSION_COMPATIBLE FALSE)
              endif()
            endif()
          endif()
          EOF

          cat << 'EOF' > "pkg/${PKG_NAME}/lib/cmake/HQRN/HQRNConfig.cmake"
          if(NOT TARGET HQRN::hqrn)
            add_library(HQRN::hqrn INTERFACE IMPORTED)
            set_target_properties(HQRN::hqrn PROPERTIES
              INTERFACE_INCLUDE_DIRECTORIES "${CMAKE_CURRENT_LIST_DIR}/../../../include"
              INTERFACE_COMPILE_FEATURES "cxx_std_20"
            )
          endif()
          EOF

          mkdir -p dist
          tar -czf "dist/${PKG_NAME}.tar.gz" -C pkg "${PKG_NAME}"
          (cd pkg && zip -q -r "../dist/${PKG_NAME}.zip" "${PKG_NAME}")

          cd dist
          sha256sum "${PKG_NAME}.tar.gz" "${PKG_NAME}.zip"

      - name: Upload Header Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-pkg-headers
          path: dist/*
          retention-days: 14

  # ===========================================================================
  # 6. Release Build: Linux x86_64 (AVX2/FMA & Generic Scalar)
  # ===========================================================================
  build-release-linux-x86_64:
    name: Package Linux x86_64 (AVX2 & Scalar)
    needs: [resolve-version, x86_64-avx2-fma]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++-14
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100

      - name: Build & Package Native AVX2/FMA Optimized Binaries
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          PKG_NAME="hqrn-${VERSION}-linux-x86_64-avx2"
          mkdir -p dist

          echo "Configuring x86_64 AVX2/FMA Release Build..."
          cmake -B build-avx2 -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DENABLE_BENCHMARKS=ON             -DBUILD_TESTING=ON             -DCMAKE_INSTALL_PREFIX="/usr"

          cmake --build build-avx2

          echo "Running Smoke Tests on AVX2 Binaries..."
          ./build-avx2/test_cpu_dispatch
          ./build-avx2/test_daw_adapter
          ./build-avx2/benchmark_vector_paths

          echo "Installing into staging directory..."
          DESTDIR="$(pwd)/stage-avx2/${PKG_NAME}" cmake --install build-avx2

          tar -czf "dist/${PKG_NAME}.tar.gz" -C stage-avx2 "${PKG_NAME}"
          (cd stage-avx2 && zip -q -r "../dist/${PKG_NAME}.zip" "${PKG_NAME}")

      - name: Build & Package x86_64 Generic Scalar Fallback Binaries
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          PKG_NAME="hqrn-${VERSION}-linux-x86_64-scalar"

          echo "Configuring x86_64 Scalar Release Build..."
          cmake -B build-scalar -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DENABLE_BENCHMARKS=ON             -DBUILD_TESTING=ON             -DHQRN_FORCE_SCALAR=1             -DCMAKE_CXX_FLAGS="-DHQRN_FORCE_SCALAR=1 -mno-avx2 -mno-fma"             -DCMAKE_INSTALL_PREFIX="/usr"

          cmake --build build-scalar

          echo "Running Smoke Tests on Scalar Binaries..."
          ./build-scalar/test_cpu_dispatch_scalar

          echo "Installing into staging directory..."
          DESTDIR="$(pwd)/stage-scalar/${PKG_NAME}" cmake --install build-scalar

          tar -czf "dist/${PKG_NAME}.tar.gz" -C stage-scalar "${PKG_NAME}"
          (cd stage-scalar && zip -q -r "../dist/${PKG_NAME}.zip" "${PKG_NAME}")

      - name: Upload x86_64 Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-pkg-linux-x86_64
          path: dist/*
          retention-days: 14

  # ===========================================================================
  # 7. Release Build: Linux ARM64 (Native NEON & Generic Scalar)
  # ===========================================================================
  build-release-linux-arm64:
    name: Package Linux ARM64 (NEON & Scalar)
    needs: [resolve-version, arm64-neon-linux]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++-14 zip
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100

      - name: Build & Package Native NEON Optimized Binaries
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          PKG_NAME="hqrn-${VERSION}-linux-aarch64-neon"
          mkdir -p dist

          echo "Configuring ARM64 NEON Release Build..."
          cmake -B build-neon -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DENABLE_BENCHMARKS=ON             -DBUILD_TESTING=ON             -DCMAKE_INSTALL_PREFIX="/usr"

          cmake --build build-neon

          echo "Running Smoke Tests on Native ARM64 NEON Binaries..."
          ./build-neon/test_cpu_dispatch
          ./build-neon/test_daw_adapter
          ./build-neon/benchmark_vector_paths

          echo "Installing into staging directory..."
          DESTDIR="$(pwd)/stage-neon/${PKG_NAME}" cmake --install build-neon

          tar -czf "dist/${PKG_NAME}.tar.gz" -C stage-neon "${PKG_NAME}"
          (cd stage-neon && zip -q -r "../dist/${PKG_NAME}.zip" "${PKG_NAME}")

      - name: Build & Package ARM64 Generic Scalar Fallback Binaries
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          PKG_NAME="hqrn-${VERSION}-linux-aarch64-scalar"

          echo "Configuring ARM64 Scalar Release Build..."
          cmake -B build-scalar -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DENABLE_BENCHMARKS=ON             -DBUILD_TESTING=ON             -DHQRN_FORCE_SCALAR=1             -DCMAKE_CXX_FLAGS="-DHQRN_FORCE_SCALAR=1"             -DCMAKE_INSTALL_PREFIX="/usr"

          cmake --build build-scalar

          echo "Running Smoke Tests on ARM64 Scalar Binaries..."
          ./build-scalar/test_cpu_dispatch_scalar

          echo "Installing into staging directory..."
          DESTDIR="$(pwd)/stage-scalar/${PKG_NAME}" cmake --install build-scalar

          tar -czf "dist/${PKG_NAME}.tar.gz" -C stage-scalar "${PKG_NAME}"
          (cd stage-scalar && zip -q -r "../dist/${PKG_NAME}.zip" "${PKG_NAME}")

      - name: Upload ARM64 Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-pkg-linux-arm64
          path: dist/*
          retention-days: 14

  # ===========================================================================
  # 8. Release Build: macOS ARM64 (Apple Silicon)
  # ===========================================================================
  build-release-macos-arm64:
    name: Package macOS ARM64 (Apple Silicon)
    needs: [resolve-version, arm64-neon-macos]
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build & Package Native Apple Silicon SDK
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          PKG_NAME="hqrn-${VERSION}-macos-arm64"
          mkdir -p dist
          echo "Configuring Apple Silicon Native Release Build..."
          cmake -B build-macos \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_BENCHMARKS=ON \
            -DBUILD_TESTING=ON \
            -DCMAKE_INSTALL_PREFIX="/usr/local"
          cmake --build build-macos --parallel
          echo "Executing Apple Silicon Smoke Tests..."
          ./build-macos/test_cpu_dispatch
          ./build-macos/test_daw_adapter
          ./build-macos/benchmark_vector_paths
          ./build-macos/hqrn_render --mode impulse --len 0.1 --output macos_pkg_smoke.wav
          echo "Installing into staging directory..."
          DESTDIR="$(pwd)/stage/${PKG_NAME}" cmake --install build-macos
          tar -czf "dist/${PKG_NAME}.tar.gz" -C stage "${PKG_NAME}"
          (cd stage && zip -q -r "../dist/${PKG_NAME}.zip" "${PKG_NAME}")

      - name: Upload macOS ARM64 Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-pkg-macos-arm64
          path: dist/*
          retention-days: 14

  # ===========================================================================
  # 8. Consolidate, Checksums, Manifest & Publish GitHub Release
  # ===========================================================================
  publish-release:
    name: Consolidate Artifacts & Publish Release
    needs:
      - resolve-version
      - x86_64-avx2-fma
      - arm64-neon-linux
      - test-diagnostic-verifier-negative
      - build-release-headers
      - build-release-linux-x86_64
      - build-release-linux-arm64
      - build-release-macos-arm64
    if: ${{ always() && needs.resolve-version.result == 'success' && needs.x86_64-avx2-fma.result == 'success' && needs.arm64-neon-linux.result == 'success' && needs.test-diagnostic-verifier-negative.result == 'success' && needs.build-release-headers.result == 'success' && needs.build-release-linux-x86_64.result == 'success' && needs.build-release-linux-arm64.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Release Artifact Directory
        run: mkdir -p release-dist

      - name: Download Header Package
        uses: actions/download-artifact@v4
        with:
          name: release-pkg-headers
          path: release-dist

      - name: Download Linux x86_64 Packages
        uses: actions/download-artifact@v4
        with:
          name: release-pkg-linux-x86_64
          path: release-dist

      - name: Download Linux ARM64 Packages
        uses: actions/download-artifact@v4
        with:
          name: release-pkg-linux-arm64
          path: release-dist

      - name: Download macOS ARM64 Packages (Optional Runner)
        if: ${{ needs.build-release-macos-arm64.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: release-pkg-macos-arm64
          path: release-dist

      - name: Compute Checksums & Validate Package Integrity
        id: checksums
        run: |
          cd release-dist
          echo "Verifying downloaded package archives:"
          ls -la

          # Generate SHA256 Checksums
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          echo "Generated SHA256SUMS.txt:"
          cat SHA256SUMS.txt

          # Validate Checksums
          echo "Validating SHA-256 integrity..."
          sha256sum -c SHA256SUMS.txt
          echo "Checksum verification PASSED."

      - name: Generate Release Manifest & Release Notes
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          TAG_NAME: ${{ needs.resolve-version.outputs.tag_name }}
          COMMIT_SHA: ${{ github.sha }}
          SHORT_SHA: ${{ needs.resolve-version.outputs.short_sha }}
          IS_TAG: ${{ needs.resolve-version.outputs.is_tag }}
          IS_RELEASE: ${{ needs.resolve-version.outputs.is_release }}
          PRERELEASE: ${{ needs.resolve-version.outputs.prerelease }}
          BUILD_TIME: ${{ needs.resolve-version.outputs.build_timestamp }}
        run: |
          python3 - << 'PYEOF'
          import os, glob, hashlib, json

          version = os.environ.get("VERSION", "0.1.0")
          tag_name = os.environ.get("TAG_NAME", f"v{version}")
          commit_sha = os.environ.get("COMMIT_SHA", "")
          short_sha = os.environ.get("SHORT_SHA", "")
          build_time = os.environ.get("BUILD_TIME", "")

          files_info = []
          for path in sorted(glob.glob("release-dist/*")):
              fname = os.path.basename(path)
              if fname in ("SHA256SUMS.txt", "RELEASE_MANIFEST.json", "release_notes.md"):
                  continue
              size = os.path.getsize(path)
              with open(path, "rb") as f:
                  digest = hashlib.sha256(f.read()).hexdigest()
              
              platform = "All"
              arch = "Any"
              if "linux-x86_64-avx2" in fname:
                  platform = "Linux x86_64"
                  arch = "AVX2 + FMA"
              elif "linux-x86_64-scalar" in fname:
                  platform = "Linux x86_64"
                  arch = "Scalar Generic"
              elif "linux-aarch64-neon" in fname:
                  platform = "Linux aarch64 / ARM64"
                  arch = "Native NEON"
              elif "linux-aarch64-scalar" in fname:
                  platform = "Linux aarch64 / ARM64"
                  arch = "Scalar Generic"
              elif "macos-arm64" in fname:
                  platform = "macOS Apple Silicon"
                  arch = "Native ARM64"
              elif "headers" in fname:
                  platform = "Header-only (C++20)"
                  arch = "Platform Independent"

              files_info.append({
                  "filename": fname,
                  "platform": platform,
                  "arch": arch,
                  "size_bytes": size,
                  "sha256": digest
              })

          manifest = {
              "project": "hqrn-reverb",
              "version": version,
              "tag_name": tag_name,
              "commit_sha": commit_sha,
              "short_sha": short_sha,
              "build_timestamp": build_time,
              "artifacts": files_info
          }

          with open("release-dist/RELEASE_MANIFEST.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)

          # Write Release Notes Markdown
          notes = "## HQRN Audio DSP Engine Release `" + tag_name + "`\n\n"
          notes += "**Version:** `" + version + "`\n\n"
          notes += "**Commit:** `" + short_sha + "` (" + commit_sha + ")\n\n"
          notes += "**Build Timestamp (UTC):** `" + build_time + "`\n\n"
          notes += "### Enthaltene Pakete & Artefakte\n| Dateiname | Plattform / Typ | CPU-Instruktionssatz | Größe (KB) |\n|---|---|---|---|\n"
          for item in files_info:
              kb = round(item["size_bytes"] / 1024, 1)
              notes += f"| `{item['filename']}` | {item['platform']} | {item['arch']} | {kb} KB |\n"
          notes += "\n### Paketinhalt\nDas HQRN-Core ist eine Header-only-C++20-Engine. Die Plattformarchive enthalten die Header, CMake-Paketkonfiguration, Tests und optional den Benchmark; sie enthalten weder ein VST-, AU- oder CLAP-Plugin noch eine vorkompilierte DSP-Bibliothek.\n\n### Prüfsummen (SHA-256)\n```text\n"
          with open("release-dist/SHA256SUMS.txt", "r") as sf:
              notes += sf.read()
          notes += "```\n\n### Hinweise\n- C++20 Header-only DSP Engine\n- Native x86_64 AVX2/FMA-, Linux ARM64 NEON- und macOS Apple Silicon Builds\n- Generische skalare Varianten\n"
          with open("release-dist/release_notes.md", "w", encoding="utf-8") as f:
              f.write(notes)
          PYEOF

          # Append to GitHub Actions Summary
          cat release-dist/release_notes.md >> $GITHUB_STEP_SUMMARY

      - name: Upload Consolidated Release Bundle Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hqrn-release-${{ needs.resolve-version.outputs.version }}
          path: release-dist/*
          retention-days: 90

      - name: Publish Official GitHub Release
        if: ${{ needs.resolve-version.outputs.is_release == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.resolve-version.outputs.tag_name }}
          PRERELEASE: ${{ needs.resolve-version.outputs.prerelease }}
        run: |
          echo "Publishing release for tag ${TAG_NAME}..."
          EXTRA_FLAGS=""
          if [ "${PRERELEASE}" = "true" ]; then
            EXTRA_FLAGS="--prerelease"
          fi

          # Use GitHub CLI to create or update release
          cd release-dist
          gh release create "${TAG_NAME}"             *.tar.gz *.zip SHA256SUMS.txt RELEASE_MANIFEST.json             --title "HQRN Audio DSP Engine ${TAG_NAME}"             --notes-file release_notes.md             --target "${{ github.sha }}"             ${EXTRA_FLAGS}
